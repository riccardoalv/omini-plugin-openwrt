# Development only: Omini installs the plugin from requirements.txt and adds its
# own copy of omini-sdk to the plugin's environment.
[project]
name = "omini-plugin-openwrt"
version = "0.3.1"
description = "Omini plugin for OpenWrt"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "omini-sdk"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.uv.sources]
# The SDK lives in the Omini repository.
omini-sdk = { path = "../omini/sdk/python" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
